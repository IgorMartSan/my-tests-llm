[project]
name = "langchain_agents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Igor Martins", email = "igor.mart.san@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=1.6.10",
    "langchain-openai>=1.7.1",
    "langgraph>=1.2.15",
]

[project.scripts]
langchain_agents = "langchain_agents:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"


[tool.ruff]
line-length = 200

[tool.ruff.format]
line-ending = "auto"

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]
